<section class="auth-page">
  <mat-card class="auth-card auth-page__card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Login</h1>
    </div>
    <form class="auth-form auth-card__form" [formGroup]="form">
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Login</mat-label>
        <input
          matInput
          type="text"
          formControlName="email"
          placeholder="Email or username"
          class="auth-form__input"
        />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Password</mat-label>
        <app-password-field formControlName="password" />
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="auth-form__action"
      >
        Sign In
      </button>
    </form>
    <div class="auth-card__actions">
      <button
        mat-link
        type="button"
        [routerLink]="['/' + appRoute.Reset]"
        class="auth-card__link"
      >
        Reset Password
      </button>
    </div>
  </mat-card>
</section>

<p>Email: {{ form.value.email }}</p>
<p>Password: {{ form.value.password }}</p>
