<mat-form-field
  appearance="outline"
  class="auth-form__field auth-form__field--full-width"
>
  <mat-label>Password</mat-label>
  <input
    matInput
    placeholder="Password"
    class="auth-form__input"
    type="text"
    [value]="
      isMasked
        ? (realPassword | maskRange: 0 : realPassword.length)
        : realPassword
    "
    (beforeinput)="onBeforeInput($event)"
    (input)="onInputChange($event)"
    [formControl]="control"
  />
  <button
    matSuffix
    type="button"
    class="password-toggle"
    [attr.aria-label]="isMasked ? 'Show password' : 'Hide password'"
    [attr.title]="isMasked ? 'Show password' : 'Hide password'"
    (click)="toggleVisibility()"
  >
    <mat-icon>{{ isMasked ? 'visibility' : 'visibility_off' }}</mat-icon>
  </button>
</mat-form-field>
