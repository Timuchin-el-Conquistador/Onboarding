<mat-form-field appearance="outline" class="auth-form__field auth-form__field--full-width">
  <mat-label>Password</mat-label>
  <input
    matInput
    [type]="hidden ? 'text' : 'password'"
    placeholder="Password"
    class="auth-form__input"
  />
  <button
    matSuffix
    type="button"
    class="password-toggle"
    [attr.aria-label]="hidden ? 'Hide password' : 'Show password'"
    [attr.title]="hidden ? 'Hide password' : 'Show password'"
    (click)="toggleVisibility()"
  >
    <mat-icon>{{ hidden ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
</mat-form-field>
