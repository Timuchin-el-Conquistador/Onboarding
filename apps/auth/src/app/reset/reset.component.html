<section class="auth-page">
  <mat-card class="auth-card auth-page__card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Reset password</h1>
    </div>
    <form class="auth-form auth-card__form" [formGroup]="form">
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="auth-form__input"
        />
      </mat-form-field>
      <app-password-field [control]="form.controls.password" />
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="auth-form__action"
      >
        Send reset link
      </button>
    </form>
    <div class="auth-card__actions">
      <button
        mat-link
        type="button"
        [routerLink]="['/' + appRoute.Login]"
        class="auth-card__link"
      >
        Back to login
      </button>
    </div>
  </mat-card>
</section>
