<section class="auth-page">
  <mat-card class="auth-card auth-page__card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Reset password</h1>
    </div>
    <form
      class="auth-form auth-card__form"
      [formGroup]="form"
      (ngSubmit)="reset()"
    >
      @if (form.hasError('serverError')) {
        <div class="auth-form__message auth-form__message--error" role="alert">
          <mat-icon class="auth-form__server-error-icon">
            error_outline
          </mat-icon>
          <mat-error>{{ form.getError('serverError') }}</mat-error>
        </div>
      }
      @if (successMessage()) {
        <div class="auth-form__message auth-form__message--success">
          {{ successMessage() }}
        </div>
      }
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="auth-form__input"
        />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Password</mat-label>
        <app-password-field formControlName="password" />
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="auth-form__action"
        [disabled]="loader.loading() || form.invalid"
      >
        @if (loader.loading()) {
          <mat-icon style="width: fit-content">
            <mat-spinner diameter="30"></mat-spinner>
          </mat-icon>
        } @else {
          Reset
        }
      </button>
    </form>
    <div class="auth-card__actions">
      <button
        mat-link
        type="button"
        [routerLink]="['../', appRoute.Login]"
        class="auth-card__link"
      >
        Back to login
      </button>
    </div>
  </mat-card>
</section>
