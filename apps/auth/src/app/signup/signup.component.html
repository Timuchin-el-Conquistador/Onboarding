<section class="auth-page">
  <mat-card class="auth-card auth-page__card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Sign Up</h1>
    </div>
    <form class="auth-form auth-card__form" [formGroup]="form">
      <mat-form-field
        appearance="outline"
        class="auth-form__field auth-form__field--full-width"
      >
        <mat-label>Login</mat-label>
        <input
          matInput
          type="text"
          formControlName="email"
          placeholder="Choose a username"
          class="auth-form__input"
        />
      </mat-form-field>
      <app-password-field [control]="form.controls.password" />
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="auth-form__action"
      >
        Register
      </button>
    </form>
  </mat-card>
</section>
