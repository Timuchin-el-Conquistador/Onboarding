<header>
  <mat-toolbar color="primary" class="app-header">
    <div class="app-header__toolbar-inner">
      <div class="app-header__brand">Access Portal</div>

      <nav class="app-header__links" aria-label="Authentication navigation">
        @let config = config$ | async;

        @for (button of config; track button.label) {
          <button
            mat-stroked-button
            [routerLink]="button.routerLink"
            routerLinkActive="active-link"
            (click)="button.action?.(injector)"
          >
            {{ button.label }}
          </button>
        }
      </nav>
    </div>
  </mat-toolbar>
</header>

<router-outlet></router-outlet>
