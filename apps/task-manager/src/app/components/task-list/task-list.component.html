<div class="form">
  <app-todo-form (save)="createTask($event)" submitLabel="Add Task" />
</div>

<ul class="tasks">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        (removeTask)="removeTask(task.id, $event)"
        (updateTask)="
          updateTask(
            task.id,
            $event.name,
            $event.completed,
            $event.injector
          )
        "
      />
    </li>
  }

  <li class="skeleton" appScrollOnLoading>
    <div *appTaskLoading></div>
  </li>

  @if (!tasks().length && !loader.loading()) {
    <li class="tasks--empty">
      <app-empty-state>
        <p>No tasks yet. Add a task to get started!</p>
      </app-empty-state>
    </li>
  }
</ul>
