<div class="form">
  <app-todo-form (save)="createTask($event)" submitLabel="Add Task" />
</div>

<ul class="tasks">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        (removeTask)="removeTask(task.id, $event)"
        (toggleTaskCompletion)="
          toggleTaskCompletion(
            task.id,
            task.name,
            $event.completed,
            $event.injector
          )
        "
        (completeTaskEdit)="
          completeTaskEdit(task.id, $event.name, $event.injector)
        "
      />
    </li>
  }

  <li class="tasks__skeleton" #skeleton *appTaskLoading></li>

  @if (!tasks().length && !loadingManagerService.loading()) {
    <li>
      <app-empty-state>
        <p #p>No tasks yet. Add a task to get started!</p>
      </app-empty-state>
    </li>
  }
</ul>
