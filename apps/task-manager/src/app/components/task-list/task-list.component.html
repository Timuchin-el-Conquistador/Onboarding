<div class="form">
  <app-todo-form (save)="createTask($event)" submitLabel="Add Task" />
</div>

<ul class="tasks">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item [todoId]="todoId()" [task]="task" />
    </li>
  }

  <li class="tasks__skeleton" #skeleton *appTaskLoading></li>
</ul>

@if (!tasks().length && !loadingManagerService.loading()) {
  <app-empty-state>
    <p #p>No tasks yet. Add a task to get started!</p>
  </app-empty-state>
}
