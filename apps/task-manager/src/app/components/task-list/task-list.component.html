<div class="tasks-container">
  @if (tasks().length) {
    <ul class="tasks-container__list">
      @for (task of tasks(); track task.id) {
        <li>
          <app-task-item [todoId]="todoId()" [task]="task" />
        </li>
      }
    </ul>
  } @else {
    <div class="tasks-container--empty">
      <div class="tasks-container--empty-icon">📝</div>
      <p>No tasks yet. Add a task to get started!</p>
    </div>
  }
</div>
