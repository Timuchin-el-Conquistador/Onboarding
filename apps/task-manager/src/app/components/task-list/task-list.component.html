@let tasks = tasks$ | async;

<div class="tasks-container">
  @if (tasks?.length) {
    <ul class="task-list">
      @for (task of tasks; track task.id) {
        <task-item [task]="task" />
      }
    </ul>
  } @else {
    <div class="empty-state">
      <div>📝</div>
      <p>No tasks yet. Add a task to get started!</p>
    </div>
  }
</div>

<task-summary [totalTasksCount]="tasks?.length ?? 0" />
