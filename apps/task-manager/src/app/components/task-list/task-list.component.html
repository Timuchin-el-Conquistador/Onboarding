<div class="tasks-container">
  @let xxx = tasksForm$ | async;

  @if (xxx?.length) {
    <ul class="task-list">
      @for (
        task of tasksForm.controls;
        track tasksForm.controls;
        let i = $index
      ) {
        <app-task-item [task]="task" (removeTask)="removeTask(i)" />
      }
    </ul>
  } @else {
    <div class="empty-state">
      <div>📝</div>
      <p>No tasks yet. Add a task to get started!</p>
    </div>
  }
</div>
