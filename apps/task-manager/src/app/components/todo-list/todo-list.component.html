<div class="todo-app">
  <app-todo-form (save)="createTodo($event)" submitLabel="Add Todo" />

  @let todos = todos$ | async;

  <ul class="todo-app__todos">
    @for (todo of todos; track todo.id) {
      <li class="todo-app__todo">
        <app-todo-card
          [todo]="todo"
          (removeTodo)="confirmTodoRemoval(todo.id, $event)"
        />
      </li>
    }

    <li class="skeleton" appScrollOnLoading>
      <div *appTodoLoading></div>
    </li>

    @if (todos && !todos.length && !loader.loading()) {
      <li class="todo-app--empty">
        <app-empty-state>
          <p #p>No todos found. Create your first Todo List above.</p>
        </app-empty-state>
      </li>
    }
  </ul>
</div>
