<div class="todo-container">
  <ul class="todo-list todo-container__list">
    @if (todos$ | async; as todos) {
      @for (todo of todos; track todo.id) {
        <li class="todo-list__card">
          <app-todo-card [todo]="todo" />
        </li>
      }

      @if (!loadingManagerService.loading() && todos.length === 0) {
        <li class="todo-list--empty">
          <app-empty-state>
            <p #p>No todos found. Create your first Todo List above.</p>
          </app-empty-state>
        </li>
      }
    }

    <li
      class="todo-list__skeleton"
      #skeleton
      *appTodoLoading="loadingManagerService.loading(); loader: 'todo'"
    ></li>
  </ul>
</div>
