<div class="todo-container">
  <ul class="todo-list todo-container__list">
    @if (todos$ | async; as todos) {
      @for (todo of todos; track todo.id) {
        <li class="todo-list__card">
          <app-todo-card [todo]="todo" />
        </li>
      }

      @if (!loading() && todos.length === 0) {
        <li class="todo-list--empty">
          <div class="todo-list--empty-icon">📝</div>
          <p>No lists found. Create your first Todo List above.</p>
        </li>
      }
    }

    <li class="todo-list__skeleton" #skeleton>
      @if (loading()) {
        <app-todo-loading />
      }
    </li>
  </ul>
</div>
