<div class="actions">
  <div>
    You have
    <span class="summary__task-count" id="task-count">
      {{ totalTasksCount() }}
    </span>
    tasks remaining
  </div>

  <button
    class="actions__todo-all"
    id="clear-all"
    type="button"
    aria-label="Delete todo list"
    title="Delete todo list"
    (click)="removeTodo.emit()"
  >
    Remove
    <svg
      class="actions__delete-icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M3 6h18M9 6V4h6v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
