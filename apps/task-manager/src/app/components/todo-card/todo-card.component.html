<article
  class="todo-list-card"
  [class.todo-list-card--completed]="isTodoCompleted()"
  *appTodoLoading
>
  <header
    class="todo-list-card__header"
    [class.todo-list-card__header--completed]="isTodoCompleted()"
  >
    <h2 class="todo-list-card__title">
      {{ name() }}
    </h2>

    @if (isTodoCompleted()) {
      <app-icon name="check_circle" label="All tasks completed" [size]="32" />
    }
  </header>

  <div class="todo-list-card__tasks">
    <app-task-list [todoId]="id()" [tasks]="tasks()" />
  </div>

  <app-todo-summary [totalTasksCount]="incompleteTasksCount()">
    <app-icon-button
      label="Delete todo list"
      type="button"
      buttonClass="delete delete-all"
      (action)="remove()"
    >
      <span>Remove</span>
      <app-icon name="delete" />
    </app-icon-button>
  </app-todo-summary>
</article>
