<article
  class="todo-list-card"
  [class.todo-list-card--completed]="isTodoCompleted(todoIndex())"
>
  <header
    class="todo-list-card__header"
    [class.todo-list-card__header--completed]="isTodoCompleted(todoIndex())"
  >
    <h2 class="todo-list-card__title">
      {{ todoForm().controls.title.value }}
    </h2>

    @if (isTodoCompleted(todoIndex())) {
      <span
        class="todo-list-card__completed-icon"
        aria-label="All tasks completed"
        title="All tasks completed"
      >
        <svg
          class="todo-list-card__completed-icon"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          aria-hidden="true"
          focusable="false"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="m7.5 12 3 3 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    }
  </header>

  <div class="todo-list-card__form">
    <app-todo-form
      (save)="createTask(this.todoIndex(), $event)"
      submitLabel="Add Task"
    />
  </div>

  <div class="todo-list-card__tasks">
    <app-task-list
      [todoIndex]="todoIndex()"
      [form]="todoForm().controls.tasks"
    />
  </div>

  <app-todo-actions
    [totalTasksCount]="totalTasksCount(todoIndex())"
    (removeTodo)="removeTodo(todoIndex())"
  />
</article>
