<li class="task-item">
  <input
    type="checkbox"
    class="task-item__checkbox"
    [id]="'task-' + task()?.id"
    [attr.aria-label]="label()"
    [checked]="finished()"
  />

  <label class="task-item__details" [htmlFor]="'task-' + task()?.id">
    <p class="task-item__title">{{ task()?.title }}</p>
    <span class="task-item__description">
      {{ task()?.description }}
    </span>
  </label>

  <button type="button" class="task-item__delete">×</button>
</li>
