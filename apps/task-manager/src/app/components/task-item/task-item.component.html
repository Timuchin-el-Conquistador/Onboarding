<div
  class="task-item"
  [class.task-item--completed]="!this.editing() && completed()"
  *appTaskLoading
>
  <app-ui-checkbox
    [id]="`task- ${id()}`"
    [checked]="completed()"
    [label]="completed() ? 'Finished Task' : 'Pending Task'"
    (changed)="completeEdit(name(), $event)"
  />

  @if (editing()) {
    <app-todo-form
      (save)="completeEdit($event, completed())"
      [shouldResetOnSave]="false"
      submitLabel="Save"
      [form]="taskForm"
    />
  } @else {
    <p class="task-item__title">
      {{ name() | textTruncation }}
    </p>
    <div class="task-item__actions">
      <app-ui-button label="Edit task" (clicked)="startEdit()">
        <app-icon name="edit" />
      </app-ui-button>

      <app-ui-button label="Remove task" (clicked)="remove(name(), completed())" variant="danger">
        <app-icon name="delete" />
      </app-ui-button>
    </div>
  }
</div>
