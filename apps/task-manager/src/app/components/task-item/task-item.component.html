<div
  class="task-item"
  [class.task-item--completed]="!this.editing() && completed()"
  *appTaskLoading
>
  <app-checkbox
    [id]="`task- ${id()}`"
    [checked]="completed()"
    [label]="completed() ? 'Finished Task' : 'Pending Task'"
    (checkedChange)="toggleStatus($event)"
  />

  @if (editing()) {
    <app-todo-form
      (save)="completeEdit($event)"
      [shouldResetOnSave]="false"
      submitLabel="Save"
      [form]="taskForm"
    />
  } @else {
    <p class="task-item__title">
      {{ name() }}
    </p>
    <div class="task-item__actions">
      <app-icon-button
        label="Edit task"
        type="button"
        buttonClass="edit"
        (action)="startEdit()"
      >
        <app-icon name="edit" />
      </app-icon-button>

      <app-icon-button
        label="Remove task"
        type="button"
        buttonClass="delete"
        (action)="remove()"
      >
        <app-icon name="delete" />
      </app-icon-button>
    </div>
  }
</div>
