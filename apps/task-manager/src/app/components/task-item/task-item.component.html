<li
  class="task-item"
  [class.task-item--completed]="taskForm().controls.completed.value && !this.editing()"
  [class.task-item--loading]="loading()"
>
  <label
    class="task-item__checkbox"
    [for]="'task-' + taskForm().controls.id.value"
  >
    <input
      type="checkbox"
      [id]="'task-' + taskForm().controls.id.value"
      [attr.aria-label]="
        taskForm().controls.completed.value ? 'Finished Task' : 'Pending Task'
      "
      [formControl]="taskForm().controls.completed"
      (change)="toggleTaskCompletion($event.target.checked)"
    />
    <span class="task-item__checkbox-icon"></span>
  </label>

  @if (editing()) {
    <app-todo-form
      (save)="completeTaskEdit($event)"
      [shouldResetOnSave]="false"
      [form]="taskForm()"
      submitLabel="Save"
      [loading]="loading()"
    />
  } @else {
    <label
      class="task-item__details"
      [for]="'task-' + taskForm().controls.id.value"
    >
      <p class="task-item__title">
        {{ taskForm().controls.name.value }}
      </p>
    </label>
    <button type="button" class="task-item__edit" (click)="beginTaskEdit()">
      <svg
        class="task-item__edit-icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M4 20h4L19.5 8.5a2.121 2.121 0 0 0-3-3L5 17v3Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="m14.5 7.5 2 2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  }

  <button type="button" class="task-item__delete" (click)="removeTask()">
    <svg
      class="summary__delete-icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M3 6h18M9 6V4h6v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</li>
