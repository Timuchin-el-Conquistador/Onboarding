<div class="task-manager">
  <header class="task-manager__header">
    <h1 class="task-manager__title">Task Master</h1>
    <p class="task-manager__description">
      Keep track of your daily tasks with ease
    </p>
  </header>
  <app-task-form />
  <app-task-list />
  <app-task-summary
    [totalTasksCount]="totalTasksCount"
    (clearTasks)="clearTasks()"
  />
</div>
