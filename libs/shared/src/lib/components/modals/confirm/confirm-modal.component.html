<div
  class="confirm-dialog"
  role="dialog"
  aria-labelledby="confirm-title"
  aria-describedby="confirm-message"
>
  <div class="confirm-dialog__header">
    <h2 id="confirm-title" mat-dialog-title class="confirm-dialog__title">
      {{ data.title }}
    </h2>
    <button
      mat-icon-button
      mat-dialog-close
      aria-label="Close modal button"
      class="confirm-dialog__close-btn"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="confirm-dialog__content">
    <p id="confirm-message" class="confirm-dialog__message">
      {{ data.message }}
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="confirm-dialog__actions">
    @for (btn of data.buttons; track btn.label) {
      @if (btn.variant === 'raised') {
        <button
          mat-raised-button
          [color]="btn.color || 'primary'"
          [mat-dialog-close]="btn.value"
        >
          {{ btn.label }}
        </button>
      } @else {
        <button mat-button [color]="btn.color" [mat-dialog-close]="btn.value">
          {{ btn.label }}
        </button>
      }
    }
  </mat-dialog-actions>
</div>
